name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1' # Run weekly on Monday

jobs:
  backend-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies and pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
        
    - name: Run pip-audit
      working-directory: ./inter-ai-backend
      run: pip-audit -r requirements.txt
      
  frontend-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './inter-ai-frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./inter-ai-frontend
      run: npm ci
      
    - name: Run npm audit
      working-directory: ./inter-ai-frontend
      run: npm audit --audit-level=high
