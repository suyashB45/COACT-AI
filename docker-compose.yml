services:
  frontend:
    build:
      context: ./inter-ai-frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./inter-ai-backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ./inter-ai-backend/reports:/app/reports
      - ./inter-ai-backend/data:/app/data
      - ./piper_models:/app/models
      - backend-db:/app/db
    environment:
      - PORT=8000
      - MODEL_NAME=${MODEL_NAME:-qwen3.5:0.8b}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434}
      - WHISPER_CMD=whisper
      - PIPER_CMD=/app/piper/piper
      - PIPER_MODEL_PATH=${PIPER_MODEL_PATH:-/app/models/en_US-lessac-medium.onnx}
      - PIPER_MODEL_PATH_BOY=${PIPER_MODEL_PATH_BOY:-/app/models/en_US-lessac-medium.onnx}
      - PIPER_MODEL_PATH_GIRL=${PIPER_MODEL_PATH_GIRL:-/app/models/en_US-lessac-medium.onnx}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - JWT_SECRET=${JWT_SECRET:-super-secret-production-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://coact-ai.com,https://www.coact-ai.com}
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  backend-db:
