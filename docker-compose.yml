services:
  frontend:
    build:
      context: ./inter-ai-frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"




  backend:
    build:
      context: ./inter-ai-backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ./inter-ai-backend/reports:/app/reports
      - ./inter-ai-backend/data:/app/data
      - backend-db:/app/db
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-30}
      - RATE_LIMIT_INPUT_TOKENS_PER_HOUR=${RATE_LIMIT_INPUT_TOKENS_PER_HOUR:-50000}
      - RATE_LIMIT_OUTPUT_TOKENS_PER_HOUR=${RATE_LIMIT_OUTPUT_TOKENS_PER_HOUR:-20000}
      - RATE_LIMIT_DAILY_TOKENS=${RATE_LIMIT_DAILY_TOKENS:-200000}
      - MPLCONFIGDIR=/tmp
      - REPORT_MODEL=${REPORT_MODEL:-llama-3.3-70b-versatile}
      - CHAT_MODEL=${CHAT_MODEL:-llama-3.1-8b-instant}
      - GROQ_WHISPER_MODEL=${GROQ_WHISPER_MODEL:-whisper-large-v3-turbo}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://coact-ai.com,https://www.coact-ai.com}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - FLASK_ENV=production
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_ADMIN_EMAIL=${SMTP_ADMIN_EMAIL:-}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-CoactAI}
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - noeviction
    expose:
      - "6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  backend-db:
